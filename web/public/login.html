<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shellbase 登录</title>
  <style>
    :root {
      --bg: hsl(222 18% 11%); --card: hsl(222 16% 14%); --fg: hsl(214 15% 85%);
      --muted: hsl(217 11% 58%); --border: hsl(220 13% 22%); --primary: hsl(210 90% 56%);
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 340px; padding: 28px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 30px rgb(0 0 0 / .35);
    }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 16px; font-weight: 600; }
    .brand svg { color: var(--primary); }
    .hint { color: var(--muted); margin-bottom: 18px; font-size: 12px; }
    label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; height: 34px; padding: 0 10px; font: inherit; font-family: ui-monospace, monospace;
      background: var(--bg); color: inherit; border: 1px solid var(--border); border-radius: 6px;
      outline: none; transition: border-color .15s;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%; height: 34px; margin-top: 14px; font: inherit; font-weight: 500; cursor: pointer;
      background: var(--primary); color: #fff; border: 0; border-radius: 6px; transition: opacity .15s;
    }
    button:hover { opacity: .9; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: hsl(0 70% 65%); font-size: 12px; min-height: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      shellbase
    </div>
    <p class="hint">终端 · 文件 · 浏览器 · Agent，融合在一块画布上</p>
    <label for="token">访问令牌</label>
    <input id="token" type="password" placeholder="SHELLBASE_TOKEN" autofocus autocomplete="current-password" />
    <button type="submit" id="btn">进入</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const f = document.getElementById("f");
    const err = document.getElementById("err");
    const btn = document.getElementById("btn");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: document.getElementById("token").value }),
        });
        if (res.status === 204) return location.assign("/");
        err.textContent = res.status === 429 ? "尝试太频繁，请稍后再试" : "令牌不正确";
      } catch {
        err.textContent = "网络错误";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
