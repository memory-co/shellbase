[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/opt/shellbase/run/supervisord.pid

[program:fastapi]
command=/opt/shellbase/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/opt/shellbase/server
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ttyd]
command=ttyd -i 127.0.0.1 -p 7681 -W /opt/shellbase/bin/attach.sh
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c /opt/shellbase/run/nginx.conf -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
